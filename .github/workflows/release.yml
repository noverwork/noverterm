name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: noverterm-macos-release
            artifact_paths: |
              target/release/bundle/*.dmg
              target/release/bundle/noverterm.app.tar.gz
          - os: windows-latest
            artifact_name: noverterm-windows-release
            artifact_paths: |
              target/release/bundle/*.exe
          - os: ubuntu-22.04
            artifact_name: noverterm-linux-release
            artifact_paths: |
              target/release/bundle/*.AppImage
              target/release/bundle/*.deb

    steps:
      - uses: actions/checkout@v4

      # The app compares this version with the latest release to offer updates.
      - name: Inject version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          perl -0pi -e "s/^version = \".*?\"/version = \"$version\"/m" packages/desktop/Cargo.toml
          grep -m1 '^version' packages/desktop/Cargo.toml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package
        working-directory: packages/desktop
        run: cargo packager --release

      # install.sh downloads this archive.
      - name: Archive the macOS app
        if: runner.os == 'macOS'
        run: tar -czf target/release/bundle/noverterm.app.tar.gz -C target/release/bundle noverterm.app

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Noverterm ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true
          overwrite_files: true
