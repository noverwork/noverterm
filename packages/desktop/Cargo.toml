[package]
name = "desktop"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "export-types"
path = "src/export_types.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
specta-typescript = "=0.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../shared" }
orm = { path = "../orm" }
diesel = { version = "2.3", features = ["sqlite", "chrono", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# Bundled so Windows/Linux builds do not depend on a system sqlite, and so
# RETURNING (3.35) and VACUUM INTO (3.27) are always available.
libsqlite3-sys = { version = "0.36", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
russh = "0.59"
russh-sftp = "2.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tauri = { version = "2.11", features = ["test"] }
rsa = "0.10.0-rc.12"
tempfile = "3"
