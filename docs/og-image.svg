<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Noverterm social preview</title>
  <desc id="desc">An open-source alternative to Termius, with ngrok-style public URLs built in. Native SSH client for macOS, Windows and Linux, built with Rust.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.52" stop-color="#111c31" />
      <stop offset="1" stop-color="#0b1120" />
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="20%" r="70%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="78" y="78" width="1044" height="474" rx="42" fill="#0f172a" fill-opacity="0.74" stroke="#334155" />
  <svg x="118" y="118" width="86" height="86" viewBox="116 116 792 792" fill="none">
    <defs>
      <linearGradient id="base" x1="182" y1="126" x2="842" y2="900" gradientUnits="userSpaceOnUse">
        <stop stop-color="#1B2A41" />
        <stop offset="0.5" stop-color="#07111F" />
        <stop offset="1" stop-color="#020617" />
      </linearGradient>
      <linearGradient id="nStroke" x1="286" y1="342" x2="742" y2="694" gradientUnits="userSpaceOnUse">
        <stop stop-color="#CFFAFE" />
        <stop offset="0.42" stop-color="#22D3EE" />
        <stop offset="1" stop-color="#2563EB" />
      </linearGradient>
      <linearGradient id="nShadow" x1="288" y1="338" x2="740" y2="704" gradientUnits="userSpaceOnUse">
        <stop stop-color="#0E7490" />
        <stop offset="1" stop-color="#1D4ED8" />
      </linearGradient>
      <filter id="tileShadow" x="74" y="74" width="876" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="42" stdDeviation="46" flood-color="#000000" flood-opacity="0.52" />
      </filter>
      <filter id="cyanGlow" x="188" y="226" width="650" height="618" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="18" result="blur" />
        <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.133 0 0 0 0 0.827 0 0 0 0 0.933 0 0 0 0.7 0" />
        <feBlend mode="screen" in2="SourceGraphic" />
      </filter>
    </defs>
  
    <rect x="136" y="120" width="752" height="784" rx="174" fill="url(#base)" filter="url(#tileShadow)" />
    <rect x="164" y="148" width="696" height="728" rx="148" stroke="white" stroke-opacity="0.11" stroke-width="4" />
  
    <g filter="url(#cyanGlow)">
      <path d="M318 678V346" stroke="url(#nShadow)" stroke-width="106" stroke-linecap="round" />
      <path d="M318 346L706 678" stroke="url(#nShadow)" stroke-width="106" stroke-linecap="round" />
      <path d="M706 346V678" stroke="url(#nShadow)" stroke-width="106" stroke-linecap="round" />
  
      <path d="M318 678V346" stroke="url(#nStroke)" stroke-width="78" stroke-linecap="round" />
      <path d="M318 346L706 678" stroke="url(#nStroke)" stroke-width="78" stroke-linecap="round" />
      <path d="M706 346V678" stroke="url(#nStroke)" stroke-width="78" stroke-linecap="round" />
    </g>
  </svg>
  <text x="118" y="262" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-4">Noverterm</text>
  <text x="118" y="344" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Open-source Termius alternative</text>
  <text x="118" y="414" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="30">macOS · Windows · Linux · Rust · No Electron</text>
  <g transform="translate(780 132)">
    <rect width="282" height="296" rx="26" fill="#020617" stroke="#334155" />
    <rect width="282" height="48" rx="26" fill="#111827" />
    <circle cx="31" cy="24" r="7" fill="#fb7185" />
    <circle cx="54" cy="24" r="7" fill="#facc15" />
    <circle cx="77" cy="24" r="7" fill="#22c55e" />
    <text x="26" y="94" fill="#38bdf8" font-family="SFMono-Regular, Consolas, monospace" font-size="20">$ ssh production</text>
    <text x="26" y="136" fill="#86efac" font-family="SFMono-Regular, Consolas, monospace" font-size="20">connected</text>
    <text x="26" y="186" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="20">SFTP ready</text>
    <text x="26" y="228" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="20">tunnel :5432</text>
  </g>
</svg>
